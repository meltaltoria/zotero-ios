# This workflow is mirrored on the default branch so it can be manually dispatched.
name: iPad PDF Translation CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch, tag, or commit to build"
        required: true
        default: "feature/pdf-translate-ios"
        type: string
      run_tests:
        description: "Run the Zotero XCTest suite after the build"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "feature/pdf-translate-ios"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPad PDF Translation
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          xcrun simctl list runtimes | grep -E "iOS 26\\.(4|5)" || true
          xcrun simctl list devices available | grep -F "iPad Pro 13-inch (M5)" || true

      - name: Install build tools
        run: |
          which swiftgen || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftgen
          which swiftlint || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftlint

      - name: Prepare generated dependencies
        run: ./scripts/setup.sh

      - name: Verify signing script behavior
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Zotero.xcodeproj \
            -scheme Zotero \
            -resolvePackageDependencies

      - name: Build and test on iPad Simulator
        env:
          RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -o pipefail
          mkdir -p build/ci

          DESTINATION="platform=iOS Simulator,OS=26.5,name=iPad Pro 13-inch (M5)"

          if [ "$RUN_TESTS" = "true" ]; then
            # Test enables TESTING, including the foreground session used by network stubs.
            xcodebuild \
              -quiet \
              -project Zotero.xcodeproj \
              -scheme Zotero \
              -configuration Test \
              -destination "$DESTINATION" \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM= \
              ONLY_ACTIVE_ARCH=YES \
              -resultBundlePath build/ci/ZoteroTests.xcresult \
              clean test \
              | tee build/ci/xcodebuild.log
          else
            xcodebuild \
              -quiet \
              -project Zotero.xcodeproj \
              -scheme Zotero \
              -configuration Debug \
              -destination "$DESTINATION" \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM= \
              ONLY_ACTIVE_ARCH=YES \
              clean build \
              | tee build/ci/xcodebuild.log
          fi

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pdf-translation-xcode-log
          path: build/ci/xcodebuild.log
          if-no-files-found: warn

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pdf-translation-test-results
          path: build/ci/ZoteroTests.xcresult
          if-no-files-found: ignore
