name: Run tests

on: 
  workflow_dispatch:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Xcode Tests
    runs-on: macos-26
    strategy:
      matrix:
        xcode: ["26.5"]
        ios_version: ["26.5"]
        device_name: ["iPhone 17"]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install SwiftGen
        run: which swiftgen || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftgen

      - name: Install SwiftLint
        run: which swiftlint || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftlint

      - name: Select Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: Dependencies/ONNXRuntime
          key: onnxruntime-${{ runner.os }}-${{ hashFiles('scripts/fetch_onnxruntime.sh') }}

      - name: Prepare ONNX Runtime
        run: scripts/fetch_onnxruntime.sh

      - name: Clean & Build & Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/full-suite
          xcodebuild -quiet \
            -project Zotero.xcodeproj -scheme Zotero \
            -destination 'platform=iOS Simulator,OS=${{ matrix.ios_version }},name=${{ matrix.device_name }}' \
            -resultBundlePath build/full-suite/iPhone.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            clean test 2>&1 | tee build/full-suite/xcodebuild.log

      - name: Export test summary
        if: always()
        shell: bash
        run: |
          if [ -d build/full-suite/iPhone.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/full-suite/iPhone.xcresult > build/full-suite/summary.json
          fi

      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-full-suite-diagnostics
          path: |
            build/full-suite/*.log
            build/full-suite/*.json
          if-no-files-found: ignore

      - name: Upload full-suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-full-suite-results
          path: build/full-suite/*.xcresult
          if-no-files-found: ignore
